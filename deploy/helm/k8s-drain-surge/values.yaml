replicaCount: 2

image:
  repository: ghcr.io/aeyrtonvs/k8s-drain-surge
  pullPolicy: IfNotPresent
  tag: ""

controller:
  drainTaints:
    - key: "karpenter.sh/disrupted"
      effect: "NoSchedule"
    - key: "ToBeDeletedByClusterAutoscaler"
      effect: "NoSchedule"
    - key: "node.kubernetes.io/unschedulable"
      effect: "NoSchedule"
  readinessTimeout: "10m"
  requeueInterval: "5s"
  leaderElect: true
  metricsPort: 8080
  healthPort: 8081
  # Restart-surge protects single-replica Argo Rollouts whose `kubectl argo
  # rollouts restart` is blocked indefinitely by a `minAvailable: 1` PDB
  # (Argo's PodRestarter uses the eviction API). Disabled by default; only
  # useful when you run Argo Rollouts. See CLAUDE.md ➜ Restart-surge state
  # machine.
  restartSurge:
    enabled: false
    gracePeriod: "60s"
    timeout: "10m"
  # Karpenter-surge handles the case where Karpenter's *disruption*
  # controller aborts pre-taint when a PDB would block eviction in
  # dry-run (single-replica + `minAvailable: 1`). Trigger is the PDB
  # (disruptionsAllowed=0), not a Karpenter Event. Default ON: the PDB
  # this controller requires is the exact mechanism that creates the
  # Karpenter stuck case, so opting users into the workaround would
  # transfer to them a problem we introduced. Set to false to opt out.
  karpenterSurge:
    enabled: true
    gracePeriod: "60s"
    timeout: "10m"
    scanPeriod: "60s"

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
affinity: {}

priorityClassName: system-cluster-critical

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  # No CPU limit: throttling a reactive controller hurts reconcile
  # latency during the moments it matters most (e.g. mid-drain). See
  # https://home.robusta.dev/blog/stop-using-cpu-limits for context.
  limits:
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}
