apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-drain-surge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-drain-surge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-drain-surge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-drain-surge.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-drain-surge.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --readiness-timeout={{ .Values.controller.readinessTimeout }}
            - --requeue-interval={{ .Values.controller.requeueInterval }}
            - --metrics-addr=:{{ .Values.controller.metricsPort }}
            - --health-addr=:{{ .Values.controller.healthPort }}
            {{- with .Values.controller.restartSurge }}
            - --restart-surge-enabled={{ .enabled }}
            {{- if .enabled }}
            - --restart-surge-grace-period={{ .gracePeriod }}
            - --restart-surge-timeout={{ .timeout }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.controller.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
