name: Release

on:
  push:
    tags: ["release/*"]

permissions:
  contents: write
  packages: write
  # Required by cosign keyless: lets the runner request a short-lived
  # OIDC token from GitHub Actions, which Fulcio uses to mint the
  # signing certificate. Without this, `cosign sign --yes` fails.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Tag format: release/x.x.x -> version: x.x.x
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance attestations create an extra unknown/unknown manifest
          # entry that some OCI clients (including older Helm/containerd
          # paths) mis-handle on multi-arch lists. Disable until needed.
          provenance: false

      - name: Sign container image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign by digest, not by tag — tags are mutable, digests are not,
          # so this binds the signature to the exact bits we just pushed.
          # Only one sign call is needed even though we publish multiple tags;
          # cosign verify <tag> resolves the tag to the digest and finds it.
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          helm package deploy/helm/k8s-drain-surge \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Push Helm chart
        id: push_chart
        run: |
          # helm push has no flag to emit the digest separately (as of v3.14),
          # so we capture stdout and grep the "Digest:" line. Cosign needs the
          # digest because signing by tag would not survive a tag rewrite.
          OUTPUT=$(helm push k8s-drain-surge-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart with cosign (keyless)
        env:
          DIGEST: ${{ steps.push_chart.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/k8s-drain-surge@${DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: k8s-drain-surge-*.tgz
