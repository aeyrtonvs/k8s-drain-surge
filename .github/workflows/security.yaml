name: Security

on:
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.devcontainer/**'
      - '.github/workflows/release.yaml'
      - 'artifacthub-repo.yml'
      - 'hack/test-*.yaml'
      - 'deploy/helm/**'
  push:
    branches: [master, develop]
  schedule:
    # Daily catch for CVEs that landed in stale dependencies overnight,
    # so a green master that we haven't touched doesn't silently rot.
    - cron: '17 6 * * *'

# Auto-cancel earlier runs of the same ref so a fresh push supersedes
# any in-flight scan and we don't waste minutes on superseded SHAs.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      # Stop the whole matrix the moment any scanner reports a CRITICAL/HIGH
      # finding — no point keeping the other scans running on the same
      # bad commit.
      fail-fast: true
      matrix:
        scanner: [govulncheck, trivy-fs, trivy-image]
    steps:
      - uses: actions/checkout@v6

      - if: matrix.scanner == 'govulncheck'
        name: govulncheck (Go stdlib + module CVEs reachable from code)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

      - if: matrix.scanner == 'trivy-fs'
        name: Trivy filesystem scan (go.sum + workflows + Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # SARIF would be nicer but requires code-scanning permissions
          # and Advanced Security on private repos. table output keeps
          # the action free and immediately readable in logs.
          format: table

      - if: matrix.scanner == 'trivy-image'
        name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: k8s-drain-surge:scan
          push: false

      - if: matrix.scanner == 'trivy-image'
        name: Trivy image scan (final controller image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: k8s-drain-surge:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
