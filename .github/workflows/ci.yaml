name: CI

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race

      - name: Build binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/controller

      - name: Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deploy/helm/k8s-drain-surge
