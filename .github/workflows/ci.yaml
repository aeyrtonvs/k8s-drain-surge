name: CI

on:
  pull_request:
    branches: [master, develop]
    # Skip CI on PRs that only touch files which can't affect build, tests,
    # image, or chart. If a PR mixes docs + code, CI still runs (GitHub
    # evaluates ignored paths only when ALL changed files match).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.devcontainer/**'
      - '.github/workflows/release.yaml'
      - 'artifacthub-repo.yml'
      - 'hack/test-*.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race

      - name: Build binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/controller

      - name: Docker build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint deploy/helm/k8s-drain-surge
