apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: test-bluegreen
  annotations:
    k8s-drain-surge.io/enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-bluegreen
  template:
    metadata:
      labels:
        app: test-bluegreen
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
  strategy:
    blueGreen:
      activeService: test-bluegreen-active
      autoPromotionEnabled: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-bluegreen-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: test-bluegreen
---
apiVersion: v1
kind: Service
metadata:
  name: test-bluegreen-active
spec:
  selector:
    app: test-bluegreen
  ports:
    - port: 80
      targetPort: 80
