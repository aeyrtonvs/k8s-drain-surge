apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: test-canary
  annotations:
    k8s-drain-surge.io/enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-canary
  template:
    metadata:
      labels:
        app: test-canary
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 10s }
        - setWeight: 50
        - pause: { duration: 10s }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-canary-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: test-canary
---
apiVersion: v1
kind: Service
metadata:
  name: test-canary
spec:
  selector:
    app: test-canary
  ports:
    - port: 80
      targetPort: 80
