apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  annotations:
    k8s-drain-surge.io/enabled: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: test-deployment
  template:
    metadata:
      labels:
        app: test-deployment
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-deployment-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: test-deployment
---
apiVersion: v1
kind: Service
metadata:
  name: test-deployment
spec:
  selector:
    app: test-deployment
  ports:
    - port: 80
      targetPort: 80
